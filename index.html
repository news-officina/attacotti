<body><main>
<h1>Attacotti</h1>
<p>A Scottish voice from exile in Belgium. The first pieces are on their way.</p>
<p class="muted">Articles here are drafted with AI from public sources and checked by an editor before they appear. The voice is a persona, not a person. Attacotti is independent and speaks for no party or movement.</p>
